[project]
name = "smpc"
version = "0.0.1"
description = "Shared adaptation for cooperative cable-suspended transport (MuJoCo + MPPI)"
requires-python = ">=3.10"
dependencies = ["mujoco", "numpy", "matplotlib", "pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
